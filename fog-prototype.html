<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strike — Fog Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1119;
    color: #f2f4f8;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
    user-select: none;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px; margin-bottom: 4px; }
  .subtitle { color: #5a6270; font-size: 13px; margin-bottom: 16px; }
  #hud {
    display: flex;
    gap: 32px;
    margin-bottom: 16px;
    font-size: 15px;
  }
  #hud .label { color: #5a6270; font-size: 12px; display: block; text-align: center; }
  #hud .value { font-size: 20px; font-weight: 600; text-align: center; }
  #hud .value.warn { color: #e78a6e; }
  #board { cursor: pointer; border-radius: 8px; }
  #message {
    margin-top: 16px;
    font-size: 18px;
    min-height: 28px;
    text-align: center;
  }
  #message.win { color: #6ee7a0; }
  #message.lose { color: #e78a6e; }
  #retry {
    margin-top: 12px;
    padding: 10px 28px;
    font-size: 15px;
    background: #1a2230;
    color: #f2f4f8;
    border: 1px solid #2a3444;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }
  #retry:hover { background: #243044; }
  #retry.show { display: block; }
</style>
</head>
<body>
<h1>STRIKE · FOG</h1>
<div class="subtitle">prototype — hidden dots reveal as you move</div>
<div id="hud">
  <div><span class="label">DOTS</span><div class="value" id="dotCount">1/12</div></div>
  <div><span class="label">MOVES</span><div class="value" id="moveCount">0/6</div></div>
</div>
<canvas id="board"></canvas>
<div id="message"></div>
<button id="retry">↺ Retry</button>

<script>
'use strict';
/* ============ Config ============ */
var SIZE = 9;
var CELL = 64;
var PAD = 32;
var K = 6;

var VISIBLE_DOTS = [[1,1],[1,7],[7,7],[7,1],[4,4]];
var HIDDEN_DOTS  = [[1,3],[2,7],[7,6],[6,2],[2,2],[3,3],[5,5]];
var START = [1, 1];
var TOTAL = VISIBLE_DOTS.length + HIDDEN_DOTS.length; // 12

/* ============ State ============ */
var pos, visited, revealed, revealTime, moves, path, gameOver, won;

function key(x, y) { return x + ',' + y; }

function reset() {
  pos = START.slice();
  visited = {};
  revealed = {};      // hidden index -> true
  revealTime = {};    // hidden index -> performance.now() when revealed
  moves = 0;
  path = [START.slice()];
  gameOver = false;
  won = false;
  visited[key(START[0], START[1])] = true;
  revealAround(pos, true);
  document.getElementById('message').textContent = '';
  document.getElementById('message').className = '';
  document.getElementById('retry').className = '';
  updateHUD();
}

function chebyshev(a, b) {
  return Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]));
}

function revealAround(p, isInitial) {
  var now = performance.now();
  for (var i = 0; i < HIDDEN_DOTS.length; i++) {
    if (!revealed[i] && chebyshev(p, HIDDEN_DOTS[i]) <= 2) {
      revealed[i] = true;
      // Stagger initial reveals slightly for a nicer cascade
      revealTime[i] = now + (isInitial ? i * 120 : 0);
    }
  }
}

function isQueenMove(a, b) {
  var dx = Math.abs(a[0] - b[0]), dy = Math.abs(a[1] - b[1]);
  return (dx === 0 && dy > 0) || (dy === 0 && dx > 0) || (dx === dy && dx > 0);
}

function cellsOnPath(a, b) {
  var cells = [];
  var dx = Math.sign(b[0] - a[0]), dy = Math.sign(b[1] - a[1]);
  var x = a[0], y = a[1];
  while (x !== b[0] || y !== b[1]) {
    x += dx; y += dy;
    cells.push([x, y]);
  }
  return cells;
}

function hiddenIndexAt(x, y) {
  for (var i = 0; i < HIDDEN_DOTS.length; i++) {
    if (HIDDEN_DOTS[i][0] === x && HIDDEN_DOTS[i][1] === y) return i;
  }
  return -1;
}

function isVisibleDot(x, y) {
  for (var i = 0; i < VISIBLE_DOTS.length; i++) {
    if (VISIBLE_DOTS[i][0] === x && VISIBLE_DOTS[i][1] === y) return true;
  }
  return false;
}

function tryMove(tx, ty) {
  if (gameOver) return;
  if (tx < 0 || tx >= SIZE || ty < 0 || ty >= SIZE) return;
  if (tx === pos[0] && ty === pos[1]) return;
  if (!isQueenMove(pos, [tx, ty])) return;
  if (moves >= K) return;

  var cells = cellsOnPath(pos, [tx, ty]);
  for (var i = 0; i < cells.length; i++) {
    var c = cells[i], k = key(c[0], c[1]);
    if (visited[k]) continue;
    if (isVisibleDot(c[0], c[1])) {
      visited[k] = true;
    } else {
      var hi = hiddenIndexAt(c[0], c[1]);
      if (hi >= 0 && revealed[hi]) visited[k] = true;
      // unrevealed hidden dots are simply not there yet — fly through
    }
  }
  pos = [tx, ty];
  moves++;
  path.push(pos.slice());
  revealAround(pos, false);
  updateHUD();
  checkEnd();
}

function visitedCount() {
  return Object.keys(visited).length;
}

function updateHUD() {
  document.getElementById('dotCount').textContent = visitedCount() + '/' + TOTAL;
  var mc = document.getElementById('moveCount');
  mc.textContent = moves + '/' + K;
  mc.className = 'value' + (moves >= K - 1 ? ' warn' : '');
}

function checkEnd() {
  if (visitedCount() === TOTAL) {
    gameOver = true; won = true;
    var m = document.getElementById('message');
    m.textContent = 'Solved! · ' + moves + ' moves';
    m.className = 'win';
    document.getElementById('retry').className = 'show';
  } else if (moves >= K) {
    gameOver = true;
    var m2 = document.getElementById('message');
    m2.textContent = 'Out of moves — ' + visitedCount() + '/' + TOTAL + ' dots';
    m2.className = 'lose';
    document.getElementById('retry').className = 'show';
  }
}

/* ============ Rendering ============ */
var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
canvas.width = SIZE * CELL + PAD * 2;
canvas.height = SIZE * CELL + PAD * 2;
canvas.style.width = canvas.width + 'px';
canvas.style.height = canvas.height + 'px';

function cx(x) { return PAD + x * CELL + CELL / 2; }
function cy(y) { return PAD + y * CELL + CELL / 2; }

var hoverCell = null;

function draw(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Board background
  ctx.fillStyle = '#11161f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines (faint)
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  for (var i = 0; i <= SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(PAD + i * CELL, PAD); ctx.lineTo(PAD + i * CELL, PAD + SIZE * CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD, PAD + i * CELL); ctx.lineTo(PAD + SIZE * CELL, PAD + i * CELL); ctx.stroke();
  }

  // Valid-move highlights
  if (!gameOver) {
    ctx.fillStyle = 'rgba(255,215,94,0.10)';
    for (var hx = 0; hx < SIZE; hx++) {
      for (var hy = 0; hy < SIZE; hy++) {
        if ((hx === pos[0] && hy === pos[1]) || !isQueenMove(pos, [hx, hy])) continue;
        ctx.beginPath();
        ctx.arc(cx(hx), cy(hy), 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Path
  if (path.length > 1) {
    ctx.strokeStyle = '#ffd75e';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(cx(path[0][0]), cy(path[0][1]));
    for (var p = 1; p < path.length; p++) ctx.lineTo(cx(path[p][0]), cy(path[p][1]));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Dots
  var t = now;
  function drawDot(x, y, visitedFlag, revealT) {
    var alpha = 1, scale = 1;
    if (revealT !== undefined) {
      var dt = (t - revealT) / 500; // 0.5s fade
      if (dt < 0) return; // not yet (staggered)
      if (dt < 1) {
        alpha = dt;
        scale = 1.6 - 0.6 * dt; // pulse shrink
      }
    }
    ctx.save();
    ctx.globalAlpha = alpha * (visitedFlag ? 0.22 : 1);
    var r = 9 * scale;
    ctx.fillStyle = '#f2f4f8';
    ctx.beginPath();
    ctx.arc(cx(x), cy(y), r, 0, Math.PI * 2);
    ctx.fill();
    // glow for freshly revealed
    if (revealT !== undefined && (t - revealT) < 900) {
      ctx.globalAlpha = alpha * 0.35 * (1 - (t - revealT) / 900);
      ctx.fillStyle = '#ffd75e';
      ctx.beginPath();
      ctx.arc(cx(x), cy(y), r + 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  for (var v = 0; v < VISIBLE_DOTS.length; v++) {
    var d = VISIBLE_DOTS[v];
    drawDot(d[0], d[1], !!visited[key(d[0], d[1])]);
  }
  for (var h = 0; h < HIDDEN_DOTS.length; h++) {
    if (!revealed[h]) continue;
    var hd = HIDDEN_DOTS[h];
    drawDot(hd[0], hd[1], !!visited[key(hd[0], hd[1])], revealTime[h]);
  }

  // Player
  ctx.fillStyle = '#ffd75e';
  ctx.beginPath();
  ctx.arc(cx(pos[0]), cy(pos[1]), 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0d1119';
  ctx.beginPath();
  ctx.arc(cx(pos[0]), cy(pos[1]), 5, 0, Math.PI * 2);
  ctx.fill();

  // Hover target
  if (hoverCell && !gameOver && isQueenMove(pos, hoverCell)) {
    ctx.strokeStyle = 'rgba(255,215,94,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx(hoverCell[0]), cy(hoverCell[1]), 16, 0, Math.PI * 2);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}

function eventCell(e) {
  var r = canvas.getBoundingClientRect();
  var sx = canvas.width / r.width, sy = canvas.height / r.height;
  var px = (e.clientX - r.left) * sx - PAD;
  var py = (e.clientY - r.top) * sy - PAD;
  var gx = Math.floor(px / CELL), gy = Math.floor(py / CELL);
  if (gx < 0 || gx >= SIZE || gy < 0 || gy >= SIZE) return null;
  return [gx, gy];
}

canvas.addEventListener('click', function (e) {
  var c = eventCell(e);
  if (c) tryMove(c[0], c[1]);
});
canvas.addEventListener('mousemove', function (e) {
  hoverCell = eventCell(e);
});
canvas.addEventListener('mouseleave', function () { hoverCell = null; });
document.getElementById('retry').addEventListener('click', reset);

reset();
requestAnimationFrame(draw);
</script>
</body>
</html>
